name: Build Mandraky APK

on:
  workflow_dispatch: # Permite que você aperte um botão para começar

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Extract Project
        run: unzip my-app.zip

      - name: Build with Gradle
        run: |
          cd my-app/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mandraky-Editor-Pro
          path: my-app/android/app/build/outputs/apk/debug/app-debug.apk

